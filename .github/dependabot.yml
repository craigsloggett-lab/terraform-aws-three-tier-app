version: 2

registries:
  hcp-terraform:
    type: terraform-registry
    url: https://app.terraform.io
    token: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

updates:
  - package-ecosystem: terraform
    directories:
      - examples/**/*
    registries: '*'
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docs)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
